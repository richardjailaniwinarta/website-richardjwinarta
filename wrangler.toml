name = "directory-richardva"
main = "worker/index.js"
compatibility_date = "2026-10-01"

# File statis (CSS, JavaScript, gambar). Alamat yang tidak cocok diteruskan ke Worker.
[assets]
directory = "./public"

# Penyimpanan isi halaman dan foto upload.
# Ganti id dengan ID KV dari dashboard Cloudflare. Lihat README.
[[kv_namespaces]]
binding = "DATA"
id = "37b2c3f650db426899bbe1639591a6b3"

# Membatasi percobaan login: 5 kali per menit untuk tiap alamat IP.
[[ratelimits]]
name = "LOGIN_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 5
  period = 60
